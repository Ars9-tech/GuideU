<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GuideU – Campus Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; height: 100dvh; display: flex; flex-direction: column; background: #F8FAFC; overflow: hidden; }

    #topbar {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(37,99,235,0.12);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(37,99,235,0.08);
    }
    #topbar-logo { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.1rem; font-weight: 800; color: #2563EB; text-decoration: none; }
    #topbar-logo span { color: #22C55E; }
    #topbar span { font-size: 0.75rem; color: #64748B; }
    #back-btn {
      background: none; border: 1px solid rgba(37,99,235,0.2);
      color: #2563EB; border-radius: 8px; padding: 6px 14px;
      font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: background .2s;
    }
    #back-btn:hover { background: #DBEAFE; }

    #map { flex: 1; min-height: 0; }

    #locate-btn {
      position: fixed; bottom: 24px; right: 16px;
      width: 48px; height: 48px; border-radius: 50%;
      border: 1.5px solid rgba(37,99,235,0.25);
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      color: #2563EB; font-size: 1.2rem; cursor: pointer;
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(37,99,235,0.2); transition: transform .15s;
    }
    #locate-btn:active { transform: scale(0.92); }

    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(15,23,42,0.5); z-index: 1999;
      backdrop-filter: blur(2px);
    }

    #floor-popup {
      display: none; position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 3px solid #2563EB;
      border-radius: 24px 24px 0 0;
      padding: 0 0 36px; z-index: 2000;
      animation: slideUp 0.28s cubic-bezier(0.22,1,0.36,1);
      max-height: 82dvh; overflow-y: auto;
      box-shadow: 0 -8px 40px rgba(37,99,235,0.15);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    #popup-header {
      position: sticky; top: 0; background: #fff;
      padding: 14px 20px 12px;
      border-bottom: 1px solid rgba(37,99,235,0.08); z-index: 1;
    }
    #popup-drag-handle {
      width: 40px; height: 4px; background: #E2E8F0;
      border-radius: 2px; margin: 0 auto 12px;
    }
    #popup-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    #popup-title { font-size: 1.15rem; font-weight: 800; color: #2563EB; font-family: 'Plus Jakarta Sans', sans-serif; }
    #popup-desc  { font-size: 0.75rem; color: #64748B; margin-top: 3px; }
    #close-popup {
      background: #F1F5F9; border: none; color: #64748B;
      font-size: 0.9rem; width: 28px; height: 28px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    #popup-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }

    .section-label {
      font-size: 0.68rem; font-weight: 700; color: #94A3B8;
      text-transform: uppercase; letter-spacing: 0.8px; margin-top: 4px;
    }

    .floor-btn {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 14px; background: #F8FAFC;
      border: 1.5px solid rgba(37,99,235,0.12); border-radius: 12px;
      color: #0F172A; font-family: 'Inter', sans-serif;
      font-size: 0.92rem; font-weight: 600; cursor: pointer;
      text-decoration: none;
      transition: background .15s, border-color .15s, transform .1s;
      width: 100%; text-align: left;
    }
    .floor-btn:hover { background: #DBEAFE; border-color: #2563EB; }
    .floor-btn:active { transform: scale(0.98); }

    .floor-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      background: #DBEAFE; border: 1px solid rgba(37,99,235,0.2);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .floor-text { display: flex; flex-direction: column; gap: 2px; }
    .floor-text small { font-size: 0.7rem; color: #64748B; font-weight: 400; }
    .floor-badge {
      margin-left: auto; font-size: 0.65rem;
      background: #DCFCE7; color: #16A34A;
      border: 1px solid rgba(22,163,74,0.25);
      border-radius: 6px; padding: 2px 7px; font-weight: 600;
    }
    .floor-badge.no-map {
      background: #F1F5F9; color: #94A3B8;
      border-color: #E2E8F0;
    }

    #navigate-btn {
      display: block; width: 100%; text-align: center; padding: 14px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: white; border: none; border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; text-decoration: none;
      box-shadow: 0 4px 16px rgba(37,99,235,0.3);
      transition: transform .1s; margin-top: 4px;
    }
    #navigate-btn:active { transform: scale(0.98); }

    #user-badge {
      position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
      border: 1px solid rgba(37,99,235,0.2);
      color: #2563EB; font-size: 0.72rem; font-weight: 600;
      padding: 5px 14px; border-radius: 20px; z-index: 998;
      display: none; white-space: nowrap;
      box-shadow: 0 2px 8px rgba(37,99,235,0.15);
    }
  </style>
</head>
<body>

<div id="topbar">
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="/dashboard" id="topbar-logo">📍 Guide<span>U</span></a>
    <span>Tap any building</span>
  </div>
  <a href="/dashboard" id="back-btn">← Home</a>
</div>

<div id="user-badge">📍 Located</div>
<div id="map"></div>
<button id="locate-btn" onclick="panToUser()">📍</button>

<div id="overlay" onclick="closePopup()"></div>

<div id="floor-popup">
  <div id="popup-header">
    <div id="popup-drag-handle"></div>
    <div id="popup-title-row">
      <div>
        <div id="popup-title">Building</div>
        <div id="popup-desc">Select a floor</div>
      </div>
      <button id="close-popup" onclick="closePopup()">✕</button>
    </div>
  </div>
  <div id="popup-body">
    <div id="popup-info-tags"></div>
    <div class="section-label" id="floors-label">Select a Floor</div>
    <div id="floor-buttons"></div>
    <a id="navigate-btn" href="#">🧭 Navigate to This Building</a>
  </div>
</div>

<script>
  const POLYGONS  = {{ polygons|safe }};
  const FLOORS    = {{ floors|safe }};
  const LOCATIONS = {{ locations|safe }};

  const FLOOR_NAMES = ['Ground Floor', '1st Floor', '2nd Floor', '3rd Floor', '4th Floor'];
  const FLOOR_ICONS = ['🏢', '1️⃣', '2️⃣', '3️⃣', '4️⃣'];
  const FLOOR_HINTS = ['Entrance · reception · labs','Classrooms · faculty offices','Classrooms · seminar halls','Research labs · HOD offices','Admin · top-floor facilities'];
  const HAS_IMAGE = { "B Block_3": true };

  const BUILDING_COLORS = {
    "Gobble":{"color":"#F59E0B","fill":"#F59E0B"},
    "Southern Stories":{"color":"#F59E0B","fill":"#F59E0B"},
    "Hotspot":{"color":"#F59E0B","fill":"#F59E0B"},
    "Paid Mess":{"color":"#F59E0B","fill":"#F59E0B"},
    "Infinity":{"color":"#F59E0B","fill":"#F59E0B"},
    "Dominos":{"color":"#F59E0B","fill":"#F59E0B"},
    "Subway":{"color":"#F59E0B","fill":"#F59E0B"},
    "Pharmacy":{"color":"#22C55E","fill":"#22C55E"},
    "D1":{"color":"#EC4899","fill":"#EC4899"},"D2":{"color":"#EC4899","fill":"#EC4899"},
    "D3":{"color":"#EC4899","fill":"#EC4899"},"D4":{"color":"#EC4899","fill":"#EC4899"},
    "D5":{"color":"#EC4899","fill":"#EC4899"},"D6":{"color":"#EC4899","fill":"#EC4899"},
    "C1":{"color":"#0EA5E9","fill":"#0EA5E9"},"C2":{"color":"#0EA5E9","fill":"#0EA5E9"},
    "C3":{"color":"#0EA5E9","fill":"#0EA5E9"},"C4":{"color":"#0EA5E9","fill":"#0EA5E9"},
    "C5":{"color":"#0EA5E9","fill":"#0EA5E9"},"C6":{"color":"#0EA5E9","fill":"#0EA5E9"},
    "C7":{"color":"#0EA5E9","fill":"#0EA5E9"},"C8":{"color":"#0EA5E9","fill":"#0EA5E9"},
    "C9":{"color":"#0EA5E9","fill":"#0EA5E9"},"C10":{"color":"#0EA5E9","fill":"#0EA5E9"},
    "C11":{"color":"#0EA5E9","fill":"#0EA5E9"},"C12":{"color":"#0EA5E9","fill":"#0EA5E9"},
  };

  const map = L.map('map', { zoomControl: false }).setView([28.4498, 77.5838], 18);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 20
  }).addTo(map);

  for (const [name, coords] of Object.entries(POLYGONS)) {
    const c = BUILDING_COLORS[name] || {};
    const color = c.color || '#2563EB';
    const fill  = c.fill  || '#2563EB';
    const poly = L.polygon(coords, { color, fillColor: fill, fillOpacity: 0.2, weight: 2.5 }).addTo(map);
    poly.on('click', () => openPopup(name));
    const center = poly.getBounds().getCenter();
    L.marker(center, {
      icon: L.divIcon({
        html: `<div style="background:rgba(255,255,255,0.95);color:${color};padding:3px 9px;
                           border-radius:6px;font-size:0.68rem;font-weight:700;
                           white-space:nowrap;border:1.5px solid ${color}44;
                           font-family:'Inter',sans-serif;box-shadow:0 2px 6px rgba(0,0,0,0.1);">${name}</div>`,
        className: '', iconAnchor: [0, 0]
      }), interactive: false
    }).addTo(map);
  }

  let userLat = null, userLng = null, userMarker = null;
  function locateUser() {
    if (!navigator.geolocation) return;
    navigator.geolocation.watchPosition(pos => {
      userLat = pos.coords.latitude; userLng = pos.coords.longitude;
      const icon = L.divIcon({
        html: `<div style="width:14px;height:14px;background:#2563EB;border-radius:50%;
                           border:2.5px solid #fff;box-shadow:0 0 0 4px rgba(37,99,235,0.2)"></div>`,
        iconSize:[14,14], iconAnchor:[7,7], className:''
      });
      if (userMarker) userMarker.setLatLng([userLat, userLng]);
      else {
        userMarker = L.marker([userLat, userLng], { icon }).addTo(map).bindPopup('You are here');
        document.getElementById('user-badge').style.display = 'block';
      }
    }, ()=>{}, { enableHighAccuracy:true, maximumAge:3000 });
  }

  function panToUser() {
    if (userLat) map.setView([userLat, userLng], 19);
    else navigator.geolocation?.getCurrentPosition(pos => {
      userLat=pos.coords.latitude; userLng=pos.coords.longitude;
      map.setView([userLat, userLng], 19);
    }, ()=>{}, { enableHighAccuracy:true });
  }

  function openPopup(name) {
    const totalFloors = FLOORS[name];
    const loc = LOCATIONS[name];
    let emoji = '🏛️';
    if (['Gobble','Southern Stories','Hotspot','Paid Mess','Infinity','Dominos','Subway'].includes(name)) emoji='🍽️';
    else if (name==='Pharmacy') emoji='💊';
    else if (name.startsWith('D')) emoji='🏡';
    else if (name.startsWith('C')) emoji='🏠';

    // Color per building type
    let accentColor = '#2563EB';
    if (['Gobble','Southern Stories','Hotspot','Paid Mess','Infinity','Dominos','Subway'].includes(name)) accentColor='#F59E0B';
    else if (name==='Pharmacy') accentColor='#22C55E';
    else if (name.startsWith('D')) accentColor='#EC4899';
    else if (name.startsWith('C')) accentColor='#0EA5E9';

    document.getElementById('popup-title').textContent = emoji+' '+name;
    document.getElementById('popup-title').style.color = accentColor;
    document.getElementById('popup-desc').textContent  = loc ? loc.desc : '';
    document.getElementById('floor-popup').style.borderTopColor = accentColor;

    const container = document.getElementById('floor-buttons');
    const floorLabel = document.getElementById('floors-label');
    container.innerHTML = '';

    if (totalFloors) {
      floorLabel.style.display = 'block';
      for (let f = 0; f < totalFloors; f++) {
        const hasImg = HAS_IMAGE[`${name}_${f}`] || false;
        const btn = document.createElement('a');
        btn.href = `/floorplan/${encodeURIComponent(name)}/${f}`;
        btn.className = 'floor-btn';
        btn.style.cssText = `border-color:${accentColor}22;`;
        btn.innerHTML = `
          <div class="floor-icon" style="background:${accentColor}18;border-color:${accentColor}33;">${FLOOR_ICONS[f]||'🏢'}</div>
          <div class="floor-text">
            <span>${FLOOR_NAMES[f]||'Floor '+f}</span>
            <small>${FLOOR_HINTS[f]||''}</small>
          </div>
          <span class="floor-badge ${hasImg?'':'no-map'}">${hasImg?'🗺️ Map':'No map yet'}</span>`;
        container.appendChild(btn);
      }
    } else {
      floorLabel.style.display = 'none';
    }

    const navBtn = document.getElementById('navigate-btn');
    if (loc) {
      navBtn.href=`/navigate/${encodeURIComponent(name)}`;
      navBtn.style.background=`linear-gradient(135deg, ${accentColor}, ${accentColor}cc)`;
      navBtn.style.display='block';
    } else {
      navBtn.style.display='none';
    }

    // Quick info row
    let infoHtml = '';
    if (['Gobble','Southern Stories','Hotspot','Paid Mess','Infinity','Dominos','Subway'].includes(name)) {
      infoHtml = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
        <span style="background:#FEF3C7;color:#92400E;border-radius:6px;padding:3px 10px;font-size:0.7rem;font-weight:600;">🕐 Open Now</span>
        <span style="background:#DCFCE7;color:#15803D;border-radius:6px;padding:3px 10px;font-size:0.7rem;font-weight:600;">🍽️ Food Outlet</span>
      </div>`;
    } else if (name.includes('Block')) {
      infoHtml = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
        <span style="background:#DBEAFE;color:#1D4ED8;border-radius:6px;padding:3px 10px;font-size:0.7rem;font-weight:600;">🎓 Academic</span>
        <span style="background:#F5F3FF;color:#6D28D9;border-radius:6px;padding:3px 10px;font-size:0.7rem;font-weight:600;">${totalFloors||1} Floors</span>
      </div>`;
    } else if (name.startsWith('C') || name.startsWith('D')) {
      infoHtml = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
        <span style="background:#FCE7F3;color:#BE185D;border-radius:6px;padding:3px 10px;font-size:0.7rem;font-weight:600;">${name.startsWith('D')?'👩 Girls':'👨 Boys'} Hostel</span>
        <span style="background:#F0FDF4;color:#15803D;border-radius:6px;padding:3px 10px;font-size:0.7rem;font-weight:600;">🏠 Residential</span>
      </div>`;
    }
    document.getElementById('popup-info-tags').innerHTML = infoHtml;

    document.getElementById('overlay').style.display='block';
    document.getElementById('floor-popup').style.display='block';
  }

  function closePopup() {
    document.getElementById('overlay').style.display='none';
    document.getElementById('floor-popup').style.display='none';
  }

  locateUser();
</script>
</body>
</html>
