<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuideU | Hostels</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { padding-top: 70px; }
    .main { max-width: 700px; margin: 0 auto; padding: 32px 20px 60px; }
    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
    .page-header p  { color: var(--muted); font-size: 0.9rem; }
    .hostel-type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
    .hostel-type-card {
      border-radius: 20px; padding: 36px 24px;
      text-decoration: none; color: #fff;
      transition: transform .2s, box-shadow .2s;
      text-align: center;
    }
    .hostel-type-card:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(0,0,0,0.2); }
    .hostel-type-card .icon { font-size: 2.8rem; margin-bottom: 16px; }
    .hostel-type-card h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
    .hostel-type-card p  { font-size: 0.82rem; opacity: 0.85; }
    .girls { background: linear-gradient(135deg, #EC4899, #DB2777); }
    .boys  { background: linear-gradient(135deg, #0EA5E9, #0284C7); }
  </style>
</head>
<body>
<div id="cursor"></div>
<div id="cursor-ring"></div>
<div class="aurora"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>

<nav class="navbar">
  <a href="/dashboard" class="navbar-logo">📍 Guide<span>U</span></a>
  <div class="navbar-right">
    <a href="/campus" style="color:var(--blue);font-size:0.85rem;font-weight:600;text-decoration:none;">🗺️ Campus Map</a>
    <a href="/dashboard" class="logout-btn" style="border-color:var(--border);color:var(--muted);">← Dashboard</a>
  </div>
</nav>

<div class="main">
  <div class="page-header reveal">
    <h1>🏠 Hostels</h1>
    <p>Select hostel type to navigate</p>
  </div>

  <div class="hostel-type-grid reveal">
    <a href="/girls_hostel" class="hostel-type-card girls">
      <div class="icon">🏡</div>
      <h3>Girls Hostels</h3>
      <p>D1 · D2 · D3 · D4 · D5 · D6</p>
    </a>
    <a href="/boys_hostel" class="hostel-type-card boys">
      <div class="icon">🏠</div>
      <h3>Boys Hostels</h3>
      <p>C1 through C12</p>
    </a>
  </div>

  <a href="/dashboard" class="btn-secondary reveal">← Back to Dashboard</a>
</div>

<script>
  const cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
  (function anim(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(anim);})();
  const obs=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('visible')}),{threshold:0.1});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
</script>
</body>
</html>
